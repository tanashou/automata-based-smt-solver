name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }} with conda
        uses: ./.github/actions/setup-python-with-uv

      - name: Run Pytest if directory exists
        run: |
          if [ -d "./tests/" ]; then
            pytest -s
          fi
