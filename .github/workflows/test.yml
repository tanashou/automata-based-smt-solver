name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y --no-install-recommends \
              build-essential \
              graphviz \
              graphviz-dev \
              gcc && \
          sudo apt-get clean && \
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build custom dd package
        run: |
          git clone --branch v0.6.0 --depth 1 https://github.com/tulip-control/dd.git /tmp/dd
          cd /tmp/dd
          pip install cython build setuptools
          export DD_FETCH=1
          export DD_CUDD=1
          export DD_CUDD_ZDD=1
          python -m build --no-isolation
          mkdir -p ./dd-dist
          cp dist/dd-*.whl ./dd-dist/

      - name: Setup Python ${{ matrix.python-version }} with uv
        uses: ./.github/actions/setup-python-with-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install custom dd package and sync dependencies
        run: |
          uv lock --upgrade-package dd --find-links /tmp/dd/dd-dist/
          uv sync --frozen

      - name: Run Pytest if directory exists
        run: |
          if [ -d "./tests/" ]; then
            uv run pytest -s
          fi
