[project]
name = "automata_based_smt_solver"
version = "0.1.0"
description = "This repository contains configurations to set up a Python development environment using VSCode's Dev Container feature. The environment includes uv and Ruff."

authors = [{ name = "tanashou", email = "tanashou0210@gmail.com" }]

requires-python = ">=3.9"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "automata-lib[visual]>=8.4.0",
    "pysmt==0.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automata_based_smt_solver"]

[tool.uv]
dev-dependencies = [
    "pre-commit>=4.0.0",
    "pyright>=1.1.383",
    "pytest>=8.3.3",
    "ruff>=0.6.9",
]
