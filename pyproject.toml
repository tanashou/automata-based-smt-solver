# This pyproject.toml is maintained manually. Dependencies are managed
# directly in this file rather than using uv's automatic dependency resolution.
[project]
name = "absmt"
version = "1.0.0"
description = "This repository contains configurations to set up a Python development environment using VSCode's Dev Container feature. The environment includes uv and Ruff."

authors = [{ name = "tanashou", email = "" }]

readme = "README.md"
license = { file = "LICENSE" }

dependencies = ["pysmt==0.9.6"]

[dependency-groups]
test = [
    "psutil>=7.0.0",
    "pytest>=8.3.4",
    "pytest-benchmark>=5.1.0",
    "pytest-memray>=1.8.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.4.0",
    "pandas>=2.3.3"
]

lint = ["pre-commit>=4.1.0", "pyright>=1.1.392.post0", "ruff==0.12.9"]

jupyter = ["ipykernel==6.30.1"]
[tool.hatch.build.targets.wheel]
packages = ["src/absmt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
