[project]
name = "automata_based_smt_solver"
version = "0.1.0"
description = "This repository contains configurations to set up a Python development environment using VSCode's Dev Container feature. The environment includes uv and Ruff."

authors = [{ name = "tanashou", email = "" }]

requires-python = ">=3.10"
readme = "README.md"
license = { file = "licenses/automata_based_smt_solver/LICENSE" }

dependencies = ["automata-lib[visual]>=8.4.0", "pysmt==0.9.6"]

[tool.uv]
dev-dependencies = [
    "pre-commit>=4.1.0",
    "pyright>=1.1.392.post0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/automata_based_smt_solver"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
