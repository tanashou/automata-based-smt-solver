[project]
name = "smt-solver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "tanashou", email = "tanashou0210@gmail.com" }]
license = { file = "licenses/smt_solver/LICENSE" }

requires-python = ">=3.10"
dependencies = ["automata-lib[visual]>=8.4.0", "pysmt==0.9.6"]

[tool.uv]
dev-dependencies = [
    "pre-commit>=4.1.0",
    "pyright>=1.1.392.post0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smt_solver"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
